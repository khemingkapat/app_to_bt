<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Fast-Entry E-Form</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f6; color: #31333F; margin: 0; padding: 2rem; }
        .container { max-width: 900px; width: 100%; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: 0 auto; }
        .title-container { background: linear-gradient(135deg, #002b49 0%, #005691 100%); padding: 1.5rem; border-radius: 12px; color: white; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); }
        .title-container h1 { margin: 0; color: white; }
        .title-container p { color: #e2e8f0; margin: 5px 0 0 0; }
        .section-header { color: #002b49; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 1.5rem; margin-bottom: 1rem; font-size: 1.2rem; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        label { margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
        input, select { padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #005691; box-shadow: 0 0 0 2px rgba(0,86,145,0.2); }

        .error-msg { color: #ff4b4b; font-size: 0.82rem; margin-top: 4px; display: none; }
        .success-msg { color: #09ab3b; font-size: 0.82rem; margin-top: 4px; display: none; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #eee; }
        button { padding: 1rem; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-reset { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-reset:hover { background-color: #e2e8f0; }
        .btn-submit { background-color: #005691; color: white; box-shadow: 0 4px 6px rgba(0,86,145,0.3); }
        .btn-submit:hover { background-color: #003d68; }

        .hidden { display: none !important; }
        .nav-link { display: inline-block; margin-bottom: 1rem; color: #002855; text-decoration: none; font-weight: bold; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">⬅️ Back to Portal</a>
    <div class="title-container">
        <h1>⌨️ Internal Fast-Entry E-Form Portal</h1>
        <p>Optimized keyboard-only data capture workflow for insurance operations</p>
    </div>

    <form id="fastForm">
        <div class="section-header">📋 Policy Meta Details</div>
        <div class="grid-2">
            <div class="form-group"><label>Agent CODE/Name *</label><input type="text" name="agent" required placeholder="E.g., AGENT007"></div>
            <div class="form-group"><label>Effective Date *</label><input type="text" name="effective_date" required placeholder="DD/MM/YYYY"></div>
            <div class="form-group"><label>Selected Product *</label>
                <select name="product_name">
                    <option value="ESSENTIAL">ESSENTIAL</option>
                    <option value="EASYCARE">EASYCARE</option>
                </select>
            </div>
            <div class="form-group"><label>Policy Version *</label>
                <select name="policy_version">
                    <option value="Thai">Thai</option>
                    <option value="English">English</option>
                </select>
            </div>
        </div>
        <div class="grid-3">
            <div class="form-group"><label>Plan Tier *</label><input type="text" name="plan" required placeholder="E.g., ESSENTIAL1"></div>
            <div class="form-group"><label>Deductible *</label><input type="text" name="deductible" required placeholder="E.g., 0"></div>
            <div class="form-group"><label>Premium *</label><input type="text" name="premium" required placeholder="E.g., 35,000"></div>
        </div>

        <div class="section-header">👤 Main Insured Details</div>
        <div class="grid-2">
            <div class="form-group"><label>Full Name *</label><input type="text" name="name" required placeholder="First and Last Name"></div>
            <div class="form-group"><label>ID Card / Passport No. *</label><input type="text" name="id_card_no" required></div>
        </div>
        <div class="grid-3">
            <div class="form-group"><label>Date of Birth *</label><input type="text" name="dob" required placeholder="DD/MM/YYYY"></div>
            <div class="form-group"><label>Age</label><input type="number" name="age" placeholder="Auto-calculated"></div>
            <div class="form-group"><label>Nationality *</label><input type="text" name="nationality" required value="Thai"></div>
        </div>
        <div class="form-group"><label>Personal / Present Address *</label><input type="text" name="present_address" required></div>
        <div class="grid-3">
            <div class="form-group"><label>Telephone No. *</label><input type="text" name="tel" required></div>
            <div class="form-group"><label>Email Address *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Tax ID No. (Optional)</label><input type="text" name="tax_id"></div>
            <div class="form-group"><label>Beneficiary Name *</label><input type="text" name="beneficiary" required></div>
            <div class="form-group"><label>Relation to Beneficiary *</label><input type="text" name="bene_relation" required></div>
            <div class="form-group"><label>Occupation *</label><input type="text" name="occupation" required></div>
        </div>
        <div class="form-group"><label>Pre-existing Conditions or Exclusions</label><input type="text" name="exclusions" placeholder="E.g., Asthma (If none, leave blank)"></div>

        <div class="section-header">👨‍👩‍👧 Family Coverage Configuration</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Cover Spouse? (y/n) *</label>
                <select name="cover_spouse" id="coverSpouse" onchange="toggleSpouse()">
                    <option value="no">no</option>
                    <option value="yes">yes</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Children (0-3) *</label>
                <select name="child_count" id="childCount" onchange="toggleChildren()">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
                </select>
            </div>
        </div>

        <div id="spouseSection" class="hidden">
            <div class="section-header">💍 Spouse Details</div>
            <div class="grid-2">
                <div class="form-group"><label>Spouse Full Name</label><input type="text" name="sp_name"></div>
                <div class="form-group"><label>Spouse ID Card / Passport No.</label><input type="text" name="sp_id_card_no"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>Spouse Date of Birth</label><input type="text" name="sp_dob" placeholder="DD/MM/YYYY"></div>
                <div class="form-group"><label>Spouse Age</label><input type="number" name="spouse_age"></div>
                <div class="form-group"><label>Spouse Nationality</label><input type="text" name="sp_nationality" value="Thai"></div>
                <div class="form-group"><label>Spouse Beneficiary Name</label><input type="text" name="sp_beneficiary"></div>
                <div class="form-group"><label>Spouse Relation</label><input type="text" name="sp_bene_relation"></div>
                <div class="form-group"><label>Spouse Occupation</label><input type="text" name="sp_occupation"></div>
            </div>
        </div>

        <div id="childrenContainer"></div>

        <div class="actions">
            <button type="button" class="btn-reset" onclick="resetForm()">Reset Form (Alt + C) 🔄</button>
            <button type="submit" class="btn-submit">Generate Deliverables (Alt + S) 🚀</button>
        </div>
    </form>

    <div id="resultsSection" class="hidden" style="margin-top: 2rem; padding: 2rem; background: #e0f2fe; border-radius: 8px; border: 1px solid #7dd3fc;">
        <h2 style="color: #075985; margin-top: 0;">📥 Downstream Deliverables Ready</h2>
        <div class="grid-2" style="margin-top: 1rem;">
            <button onclick="downloadDocx()" style="background-color: #2563eb;">⬇️ Download Filled BlueTable DOCX</button>
            <button onclick="downloadPdf()" style="background-color: #dc2626;">⬇️ Download Pre-filled Official PDF</button>
        </div>
    </div>
</div>

<script>
    let currentFormData = {};

    function toggleSpouse() {
        const val = document.getElementById('coverSpouse').value;
        if (val === 'yes') {
            document.getElementById('spouseSection').classList.remove('hidden');
        } else {
            document.getElementById('spouseSection').classList.add('hidden');
        }
    }

    function toggleChildren() {
        const count = parseInt(document.getElementById('childCount').value, 10);
        const container = document.getElementById('childrenContainer');
        container.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            container.innerHTML += `
            <div class="section-header">👶 Child ${i} Details</div>
            <div class="grid-2">
                <div class="form-group"><label>Child ${i} Full Name</label><input type="text" name="c${i}_name"></div>
                <div class="form-group"><label>Child ${i} ID Card / Passport No.</label><input type="text" name="c${i}_id_card_no"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>Child ${i} Date of Birth</label><input type="text" name="c${i}_dob" placeholder="DD/MM/YYYY"></div>
                <div class="form-group"><label>Child ${i} Age</label><input type="number" name="child_${i}_age"></div>
                <div class="form-group"><label>Child ${i} Nationality</label><input type="text" name="c${i}_nationality" value="Thai"></div>
                <div class="form-group"><label>Child ${i} Beneficiary Name</label><input type="text" name="c${i}_beneficiary"></div>
                <div class="form-group"><label>Child ${i} Relation</label><input type="text" name="c${i}_bene_relation"></div>
                <div class="form-group"><label>Child ${i} Occupation</label><input type="text" name="c${i}_occupation"></div>
            </div>
            `;
        }
        setupKeyboardNavigation(); // Re-bind dynamic elements
    }

    function resetForm() {
        document.getElementById('fastForm').reset();
        toggleSpouse();
        toggleChildren();
        document.getElementById('resultsSection').classList.add('hidden');
    }

    function setupKeyboardNavigation() {
        const inputs = Array.from(document.querySelectorAll('input, select'));
        inputs.forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && inp.tagName !== 'BUTTON') {
                    e.preventDefault();
                    const idx = inputs.indexOf(inp);
                    if (idx > -1 && idx < inputs.length - 1) {
                        inputs[idx + 1].focus();
                    } else {
                        document.querySelector('.btn-submit').focus();
                    }
                }
            });
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key.toLowerCase() === 's') {
            e.preventDefault();
            document.querySelector('.btn-submit').click();
        }
        if (e.altKey && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            resetForm();
        }
    });

    document.getElementById('fastForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        currentFormData = Object.fromEntries(formData.entries());
        document.getElementById('resultsSection').classList.remove('hidden');
        document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
    });

    async function downloadDocx() {
        try {
            const res = await fetch('/api/generate-docx', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentFormData)
            });
            if (!res.ok) throw new Error('Failed to generate DOCX');

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'bluetable_filled.docx';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert(err.message);
        }
    }

    async function downloadPdf() {
        try {
            const res = await fetch('/api/generate-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentFormData)
            });
            if (!res.ok) throw new Error('Failed to generate PDF');

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'PreFilled_Application.pdf';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert(err.message);
        }
    }

    // Init
    setupKeyboardNavigation();
</script>
</body>
</html>
