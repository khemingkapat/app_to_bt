<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Config Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f6;
            color: #31333F;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #002855; font-weight: 800; margin-bottom: 0.5rem; }
        h2 { font-size: 1.25rem; margin-top: 1.5rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .desc { color: #555; margin-bottom: 1.5rem; line-height: 1.6; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        select, input[type="text"], textarea {
            width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }
        textarea { resize: vertical; }

        .tabs { display: flex; margin-bottom: 1rem; border-bottom: 1px solid #ccc; }
        .tab { padding: 0.5rem 1rem; cursor: pointer; background: #eee; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; margin-right: 0.25rem; }
        .tab.active { background: white; font-weight: bold; border-bottom: 1px solid white; margin-bottom: -1px; }
        .tab-content { display: none; padding: 1rem; border: 1px solid #ccc; border-radius: 0 4px 4px 4px; background: #fafafa; }
        .tab-content.active { display: block; }

        button {
            background-color: #002855; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 4px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold;
        }
        button:hover { background-color: #001a36; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }

        .alert { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; display: none; }
        .alert.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; display: block; }
        .alert.success { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; display: block; }
        .alert.info { background-color: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; display: block; }

        .nav-link { display: inline-block; margin-bottom: 1rem; color: #002855; text-decoration: none; font-weight: bold; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">⬅️ Back to Portal</a>
    <h1>⚙️ Product Config Manager</h1>
    <div class="desc">
        Administrator portal to associate product configuration parameters (pricing, underwriting, etc.) with PDF structural templates.
    </div>

    <div id="statusMessage" class="alert"></div>

    <div id="mainContent" style="display: none;">
        <h2>1. Select PDF Template</h2>
        <div class="form-group">
            <label for="pdfSelect">Choose registered PDF:</label>
            <select id="pdfSelect" onchange="updatePdfInfo()"></select>
        </div>
        <div id="pdfInfo" class="alert info"></div>

        <h2>2. Provide Product JSON Config</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('upload')">📤 Upload JSON File</div>
            <div class="tab" onclick="switchTab('paste')">✍️ Paste JSON Text</div>
        </div>

        <div id="uploadTab" class="tab-content active">
            <input type="file" id="jsonFile" accept=".json" onchange="handleFileUpload(event)">
        </div>

        <div id="pasteTab" class="tab-content">
            <textarea id="jsonText" rows="10" placeholder='{\n    "product_name": "Health and Accident Insurance",\n    "pricing": { ... }\n}' oninput="handleTextPasted(event)"></textarea>
        </div>

        <h2>3. Save Configuration</h2>
        <div class="form-group">
            <label for="targetFilename">Target Config Filename:</label>
            <input type="text" id="targetFilename" value="health_and_accident_insurance.json">
        </div>

        <button id="saveBtn" onclick="saveConfig()">🔗 Link & Save Configuration</button>
    </div>
</div>

<script>
    let registryData = {};
    let parsedJsonConfig = null;

    async function init() {
        try {
            const res = await fetch('/api/registry');
            registryData = await res.json();

            if (Object.keys(registryData).length === 0) {
                showStatus('⚠️ No PDFs are registered yet. Process a PDF via the Portal first.', 'error');
                return;
            }

            const select = document.getElementById('pdfSelect');
            for (const [pdfId, data] of Object.entries(registryData)) {
                const anchors = data.word_anchors || [];
                const preview = anchors.slice(0, 3).join(', ') || 'No anchors';
                const fieldsCount = (data.fields || []).length;

                const option = document.createElement('option');
                option.value = pdfId;
                option.text = `ID: ${pdfId.substring(0,8)}... (${fieldsCount} fields) - Words: [${preview}]`;
                select.appendChild(option);
            }

            document.getElementById('mainContent').style.display = 'block';
            updatePdfInfo();
        } catch (err) {
            showStatus('Error fetching registry: ' + err.message, 'error');
        }
    }

    function updatePdfInfo() {
        const selectedId = document.getElementById('pdfSelect').value;
        const data = registryData[selectedId];
        if (data) {
            const pages = (data.pages || []).length;
            const fields = (data.fields || []).length;
            document.getElementById('pdfInfo').innerHTML = `<strong>Selected PDF ID:</strong> <code>${selectedId}</code><br><strong>Detected Pages:</strong> ${pages} | <strong>Detected Fields:</strong> ${fields}`;
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

        if (tab === 'upload') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('uploadTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('pasteTab').classList.add('active');
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                parsedJsonConfig = JSON.parse(e.target.result);
                updateFilenameSuggestion();
                showStatus('File uploaded and parsed successfully!', 'success');
            } catch (err) {
                parsedJsonConfig = null;
                showStatus('Invalid JSON file: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
    }

    function handleTextPasted(event) {
        const text = event.target.value.trim();
        if (!text) {
            parsedJsonConfig = null;
            return;
        }
        try {
            parsedJsonConfig = JSON.parse(text);
            updateFilenameSuggestion();
            showStatus('JSON text parsed successfully!', 'success');
        } catch (err) {
            parsedJsonConfig = null;
            showStatus('Invalid JSON text: ' + err.message, 'error');
        }
    }

    function updateFilenameSuggestion() {
        if (parsedJsonConfig && parsedJsonConfig.product_name) {
            const cleanName = parsedJsonConfig.product_name.toLowerCase().replace(/\s+/g, '_');
            document.getElementById('targetFilename').value = `${cleanName}.json`;
        }
    }

    async function saveConfig() {
        if (!parsedJsonConfig) {
            showStatus('Please upload or paste a valid JSON config first.', 'error');
            return;
        }

        const pdfId = document.getElementById('pdfSelect').value;
        const filename = document.getElementById('targetFilename').value.trim();

        if (!filename) {
            showStatus('Please specify a target filename.', 'error');
            return;
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = 'Saving...';

        try {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pdf_id: pdfId,
                    filename: filename,
                    config_body: parsedJsonConfig
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed to save configuration');

            showStatus(`🎉 Configuration successfully saved to config/${filename} and linked to PDF ID ${pdfId}!`, 'success');
        } catch (err) {
            showStatus('Error saving configuration: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = '🔗 Link & Save Configuration';
        }
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusMessage');
        el.className = `alert ${type}`;
        el.innerText = msg;
    }

    // Run initialization
    init();
</script>

</body>
</html>
