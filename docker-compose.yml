services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    expose:
      - "50051"
    volumes:
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./resources:/app/resources
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - WORKER_GRPC_ADDR=worker:50051
      - TEMPLATE_PDF_PATH=/app/resources/OriginalApplication.pdf
      - TEMPLATE_DOCX_PATH=/app/resources/BlueTable.docx
    volumes:
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./resources:/app/resources
    depends_on:
      - worker
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
