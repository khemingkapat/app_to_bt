<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXA Application Tools Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f6;
            color: #31333F;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #002855;
            text-align: center;
            font-weight: 800;
        }
        .desc {
            text-align: center;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .upload-section {
            border: 2px dashed #ccc;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 2rem;
            background-color: #fafafa;
        }
        button {
            background-color: #002855;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #001a36;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none;
        }
        #errorMsg {
            color: red;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 AXA Application Tools Portal</h1>
    <div class="desc">
        Pathway A: Stateless PDF Structural Layout Mapping<br>
        Upload an Original Application PDF to extract its structure and fields statelessly.
    </div>

    <div class="upload-section" id="uploadSection">
        <input type="file" id="pdfFile" accept="application/pdf">
        <br>
        <button id="uploadBtn" onclick="uploadPDF()">Process PDF</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <p>Processing PDF... Please wait.</p>
    </div>

    <div id="errorMsg" class="hidden"></div>

    <div id="resultsSection" class="hidden">
        <h2>Extraction Results</h2>
        <p><strong>PDF ID:</strong> <span id="resPdfId"></span></p>
        <p><strong>Fields Extracted:</strong> <span id="resFieldCount"></span></p>

        <h3>Extracted Values</h3>
        <table id="valuesTable">
            <thead>
                <tr>
                    <th>Field Name</th>
                    <th>Extracted Value</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be injected here -->
            </tbody>
        </table>

        <button onclick="resetApp()">Upload Another Document</button>
    </div>
</div>

<script>
    async function uploadPDF() {
        const fileInput = document.getElementById('pdfFile');
        if (fileInput.files.length === 0) {
            alert('Please select a PDF file to upload.');
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('pdf', file);

        document.getElementById('uploadBtn').disabled = true;
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('errorMsg').classList.add('hidden');
        document.getElementById('resultsSection').classList.add('hidden');

        try {
            const response = await fetch('/api/process-pdf', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to process PDF');
            }

            // Display Results
            document.getElementById('resPdfId').innerText = data.pdf_id;
            document.getElementById('resFieldCount').innerText = data.fieldsExtracted;

            const tbody = document.querySelector('#valuesTable tbody');
            tbody.innerHTML = ''; // Clear previous

            for (const [key, value] of Object.entries(data.values)) {
                const tr = document.createElement('tr');
                const tdKey = document.createElement('td');
                tdKey.innerText = key;
                const tdVal = document.createElement('td');
                tdVal.innerText = value || '-';
                tr.appendChild(tdKey);
                tr.appendChild(tdVal);
                tbody.appendChild(tr);
            }

            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');

        } catch (error) {
            console.error('Error:', error);
            const errEl = document.getElementById('errorMsg');
            errEl.innerText = error.message;
            errEl.classList.remove('hidden');
        } finally {
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('loading').classList.add('hidden');
        }
    }

    function resetApp() {
        document.getElementById('pdfFile').value = '';
        document.getElementById('uploadSection').classList.remove('hidden');
        document.getElementById('resultsSection').classList.add('hidden');
        document.getElementById('errorMsg').classList.add('hidden');
    }
</script>

</body>
</html>
